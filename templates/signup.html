<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ffffff; color: #1b4332; padding: 30px 20px; }
    form { max-width: 360px; margin: 0 auto; }
    h1 { color: #2d9f5a; text-align: center; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2d9f5a; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <form method="POST">
    <h1>Create Account</h1>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="10" max="100" required>

    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Others">Others</option>
    </select>

    <label for="height">Height (cm)</label>
    <input type="number" id="height" name="height" min="100" max="250" required>

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" name="weight" min="20" max="300" required>

    <label for="goal">Goal</label>
    <select id="goal" name="goal" required>
      <option value="Lose weight">Lose weight</option>
      <option value="Gain weight">Gain weight</option>
      <option value="Stay fit">Stay fit</option>
    </select>

    <label for="diet">Diet type</label>
    <select id="diet" name="diet" required>
      <option value="Veg">Veg</option>
      <option value="Egg">Egg</option>
      <option value="Non-veg">Non-veg</option>
    </select>

    <label for="mobile">Mobile number</label>
    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" maxlength="10" required>

    <label for="password">Create password</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
