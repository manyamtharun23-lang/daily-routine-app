<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Routine App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Daily Routine App</h1>
  <p>Workout, diet and daily plan.</p>

  <h2>Workout Time</h2>
  <label for="workout-time">Select your workout time:</label>
  <input type="time" id="workout-time">
  <button id="save-time">Save</button>
  <p id="message"></p>

  <h2>Workout Plan</h2>
  <label for="exercise-select">Exercise:</label>
  <select id="exercise-select">
    <option value="Pushups">Pushups</option>
    <option value="Squats">Squats</option>
    <option value="Running">Running</option>
    <option value="Plank">Plank</option>
  </select>
  <label for="exercise-min">Minutes:</label>
  <input type="number" id="exercise-min" min="1" value="10">
  <button id="add-exercise">Add</button>
  <ul id="exercise-list"></ul>

  <h2>Food Plan</h2>
  <label for="food-select">Select food:</label>
  <select id="food-select">
    <option value="Egg">Egg</option>
    <option value="Rice">Rice</option>
    <option value="Banana">Banana</option>
    <option value="Almonds">Almonds</option>
    <option value="Milk">Milk</option>
  </select>
  <label for="food-qty">Quantity:</label>
  <input type="number" id="food-qty" min="1" value="1">
  <button id="add-food">Add</button>
  <ul id="food-list"></ul>
  <p id="total-calories"></p>

  <script src="script.js"></script>
</body>
</html>
